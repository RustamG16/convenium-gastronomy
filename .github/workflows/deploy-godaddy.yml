# Pillar deploy: https://convenium.at/gastronomy/ — one folder inside the studio's GoDaddy docroot.
# GENERATED by Landing-Template/build.mjs from kit/deploy/deploy-godaddy.yml; edit the template, not this copy.
# The studio site (convenium.at/) deploys from the 005-agency repo into the same public_html and never
# deletes anything, so this folder and the studio never overwrite each other. Architecture: 005-agency
# architecture.md § 8 "Pillar pages".
#
# Same safety rules as the studio pipeline:
# - Actions are pinned to full commit SHAs.
# - No --delete: nothing on the server is ever removed.
# - The host key is pinned (GODADDY_SSH_KNOWN_HOSTS); StrictHostKeyChecking is never disabled.
# - Credentials exist only as GitHub Actions secrets: the same six names as the studio repo.
name: Deploy to GoDaddy (https://convenium.at/gastronomy/)

# Every push to main deploys, like the studio site (Rustam, 2026-10-19, after the first green run on 2026-10-18).
# A push is a deploy: Rustam's word only. Actions → "Run workflow" redeploys main by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-godaddy
  cancel-in-progress: false # never cut an upload off half-way

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://convenium.at/gastronomy/
    env:
      PILLAR_PATH: gastronomy/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The page is generated and committed (Landing-Template/build.mjs); CI only checks and uploads it.
      - name: Check the page
        run: |
          test -f index.html    || { echo "::error::index.html missing"; exit 1; }
          test -f en/index.html || { echo "::error::en/index.html missing"; exit 1; }
          test -f .htaccess     || { echo "::error::.htaccess missing (rebuild with Landing-Template)"; exit 1; }
          case "$PILLAR_PATH" in
            [a-z0-9]*[a-z0-9]/) ;;
            *) echo "::error::PILLAR_PATH must be one folder name ending in / (got '$PILLAR_PATH')"; exit 1 ;;
          esac

      - name: Check deploy secrets
        env:
          HOST: ${{ secrets.GODADDY_SFTP_HOST }}
          USER: ${{ secrets.GODADDY_SFTP_USER }}
          KEY: ${{ secrets.GODADDY_SSH_KEY }}
          KNOWN: ${{ secrets.GODADDY_SSH_KNOWN_HOSTS }}
          TARGET: ${{ secrets.GODADDY_SFTP_PATH }}
        run: |
          missing=""
          for v in HOST USER KEY KNOWN TARGET; do [ -n "${!v}" ] || missing="$missing $v"; done
          if [ -n "$missing" ]; then echo "::error::missing secrets:$missing (005-agency docs/deploy-godaddy.md § Secrets)"; exit 1; fi
          # The docroot itself, never a subfolder: PILLAR_PATH is appended below. Set path secrets via
          # stdin from Windows (Git Bash rewrites a leading /home/... to D:/Git/home/...).
          case "$TARGET" in
            /home/*/public_html/) ;;
            *) echo "::error::GODADDY_SFTP_PATH must look like /home/<user>/public_html/"; exit 1 ;;
          esac

      - name: Configure SSH
        env:
          KEY: ${{ secrets.GODADDY_SSH_KEY }}
          KNOWN: ${{ secrets.GODADDY_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/godaddy
          chmod 600 ~/.ssh/godaddy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # Two passes: assets first, pages last, so no page is live before what it loads.
      # Repository files (.git, .github, README, GitHub Pages marker) never reach the server.
      - name: Upload to public_html/${{ env.PILLAR_PATH }}
        env:
          HOST: ${{ secrets.GODADDY_SFTP_HOST }}
          USER: ${{ secrets.GODADDY_SFTP_USER }}
          PORT: ${{ secrets.GODADDY_SFTP_PORT || '22' }}
          TARGET: ${{ secrets.GODADDY_SFTP_PATH }}
        run: |
          SSH="ssh -i $HOME/.ssh/godaddy -p $PORT -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o BatchMode=yes"
          SKIP="--exclude=.git/ --exclude=.github/ --exclude=README.md --exclude=.nojekyll"
          rsync -rlz --checksum --itemize-changes -e "$SSH" $SKIP \
            --exclude '*.html' --exclude '*.txt' --exclude '*.xml' \
            ./ "$USER@$HOST:$TARGET$PILLAR_PATH"
          rsync -rlz --checksum --itemize-changes -e "$SSH" $SKIP \
            --include '*/' --include '*.html' --include '*.txt' --include '*.xml' --exclude '*' \
            ./ "$USER@$HOST:$TARGET$PILLAR_PATH"

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/godaddy
